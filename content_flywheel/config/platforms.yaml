# 平台路由矩阵 —— 内容类型 → 平台的唯一事实来源
# pipeline 读这个文件决定每篇内容去哪、用什么风格改写

# 内容类型定义
content_types:
  tech:            # 技术性文章（AI/Infra/系统/科普）
    platforms:
      - zhihu      # 长文直发，教授级深度
      - xhs        # 改写：口语化+共鸣+感官细节，标题党化
      - x_tech     # X 技术号：线程版（@ai_xiaomu）
      - linkedin   # 改写：结论先行、职业视角、英文可选
      - wechat     # 长文直发（红线：不碰投资/VPN/男女对立/宗教迷信/政治）
    enabled: true

  crypto:          # 区块链/加密内容
    platforms:
      - x_crypto   # X 区块链号：短行寄存器或线程（独立账号）
      - binance    # 币安广场（无 API，粘贴发布）
    enabled: true

# 平台能力与自动化程度
platform_caps:
  zhihu:     { auto_publish: false, note: "无开放发文API（旧机器zhihu-bot可迁回则可全自动）" }
  xhs:       { auto_publish: false, note: "无开放发文API，粘贴发布" }
  x_tech:    { auto_publish: false, note: "人工发布，Buffer 已停用" }
  x_crypto:  { auto_publish: false, note: "人工发布，Buffer 已停用" }
  linkedin:  { auto_publish: false, note: "API 受限，粘贴发布" }
  wechat:    { auto_publish: false, note: "公众号API需认证号配置，当前粘贴发布" }
  binance:   { auto_publish: false, note: "币安广场无API，粘贴发布" }

# 内容红线（生成与改写时硬过滤）
redlines:
  wechat: ["投资建议", "荐股", "翻墙", "VPN", "男女对立", "宗教", "政治敏感"]
  x:      []          # X 遵守账号既有红线：不涉个人交易
  crypto_general: ["不涉个人持仓买卖", "不给具体买卖建议"]

# 自动化总开关
automation:
  auto_push_x: false   # 保留历史配置，推送入口已停用
  gen_daily_limit: 5   # 单日生成上限，防止烧钱失控
